version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directories:
      - /
      - /ChanThreadWatch.Core
      - /ChanThreadWatch.Core.Tests
      - /ChanThreadWatch.Tests
      - /ChanThreadWatch.UITests
      - /tools/stored-auth-check
    schedule:
      interval: weekly
    groups:
      test-packages:
        patterns:
          - MSTest.*
          - Microsoft.NET.Test.Sdk
