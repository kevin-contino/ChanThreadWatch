name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # Visual Studio MSBuild is required: the SDK's MSBuild cannot build the forms' non-string resx resources
      - name: Build
        run: msbuild ChanThreadWatch.sln -restore -p:RestoreLockedMode=true -p:Configuration=Release -v:minimal -nologo

      - name: Test
        run: dotnet test ChanThreadWatch.sln -c Release --no-build --filter "TestCategory!=UI" --logger trx --results-directory TestResults

      # Launches the built app and drives its window; the hosted Windows runner has an interactive desktop
      - name: UI test
        run: dotnet test ChanThreadWatch.UITests/ChanThreadWatch.UITests.csproj -c Release --no-build --filter "TestCategory=UI" --logger trx --results-directory TestResults

      # A failed UI test saves a PNG of the app window (or the whole desktop) under TestResults
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults

  offline-page-script:
    name: Offline page script
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/offline-page-script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the runner's preinstalled Node; jsdom is pinned by the lockfile and its install scripts are not run
      - name: Install jsdom
        run: npm ci --ignore-scripts

      # Runs Resources/OfflinePageScript.js in jsdom against each site fixture
      - name: Test
        run: npm test

  complexity:
    name: Cyclomatic complexity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lizard
        run: pip install lizard==1.24.0

      # Maintainer decision: every app function stays at CCN <= 5 (Designer files and tests excluded)
      - name: Check CCN <= 5
        run: lizard -l csharp -x "*Designer.cs" -x "./ChanThreadWatch.Tests/*" -x "./ChanThreadWatch.UITests/*" -x "./ChanThreadWatch.*.Tests/*" -C 5 -w .
