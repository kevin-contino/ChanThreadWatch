name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Visual Studio MSBuild cannot build the .NET 10 projects; the SDK builds the forms' resx itself
      - name: Build
        run: dotnet build ChanThreadWatch.sln -c Release -p:RestoreLockedMode=true -v:minimal -nologo

      - name: Test
        run: dotnet test ChanThreadWatch.sln -c Release --no-build --filter "TestCategory!=UI" --logger trx --results-directory TestResults

      # Launches the built app and drives its window; the hosted Windows runner has an interactive desktop
      - name: UI test
        run: dotnet test ChanThreadWatch.UITests/ChanThreadWatch.UITests.csproj -c Release --no-build --filter "TestCategory=UI" --logger trx --results-directory TestResults

      # Saved logins (DPAPI) written by the .NET Framework 4.8 app decrypt in the .NET 10 app and the reverse,
      # for settings.txt and threads.txt, under this job's one user
      - name: Saved logins across .NET Framework 4.8 and .NET 10
        shell: pwsh
        run: ./.github/scripts/test-stored-auth-cross-runtime.ps1

      # The release exes: self-contained single files for x64 and arm64
      - name: Publish
        shell: pwsh
        run: ./.github/scripts/publish-app.ps1

      # Starts the published x64 exe from a temp folder, with settings.txt next to it and then without it (the
      # runner's own AppData; this runner is a throwaway VM). Each run must reach the main window, save its
      # settings in the expected folder and exit with code 0. The arm64 exe cannot run on this x64 runner.
      - name: Start the published exe
        shell: pwsh
        run: |
          ./.github/scripts/test-published-app.ps1 -ExePath publish/ChanThreadWatch-win-x64.exe -Mode Portable
          ./.github/scripts/test-published-app.ps1 -ExePath publish/ChanThreadWatch-win-x64.exe -Mode AppData

      # A failed UI test saves a PNG of the app window (or the whole desktop) under TestResults
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults

  # ChanThreadWatch.Core on each OS. Linux and macOS skip the tests marked PendingUnix (each names
  # the MP-4 row that fixes it); Windows runs them all. Only "Core tests" below is a required check.
  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            filter: TestCategory!=UI
          - os: ubuntu-latest
            filter: TestCategory!=PendingUnix&TestCategory!=UI
          - os: macos-latest
            filter: TestCategory!=PendingUnix&TestCategory!=UI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: dotnet test ChanThreadWatch.Core.Tests -c Release -p:RestoreLockedMode=true --filter "$TEST_FILTER"
        shell: bash

  # One stable check name for all the legs: passes only if every leg succeeded, so a failed,
  # cancelled or skipped matrix fails this required check
  core-tests-result:
    name: Core tests
    needs: [core-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the legs
        env:
          RESULT: ${{ needs.core-tests.result }}
        run: |
          echo "Core tests legs: $RESULT"
          if [ "$RESULT" != "success" ]; then
            exit 1
          fi

  offline-page-script:
    name: Offline page script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/offline-page-script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the runner's preinstalled Node; jsdom is pinned by the lockfile and its install scripts are not run
      - name: Install jsdom
        run: npm ci --ignore-scripts

      # Runs Resources/OfflinePageScript.js in jsdom against each site fixture
      - name: Test
        run: npm test

  complexity:
    name: Cyclomatic complexity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lizard
        run: pip install lizard==1.24.0

      # Maintainer decision: every app function stays at CCN <= 5 (Designer files and tests excluded)
      - name: Check CCN <= 5
        run: lizard -l csharp -x "*Designer.cs" -x "./ChanThreadWatch.Tests/*" -x "./ChanThreadWatch.UITests/*" -x "./ChanThreadWatch.*.Tests/*" -C 5 -w .
