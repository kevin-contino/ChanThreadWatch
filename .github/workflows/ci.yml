name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filters live only on the jobs below that are not required checks. The required check names
  # ("Build and test", "Core tests") belong to aggregator jobs that always run and pass only when
  # "changes" succeeded and the gated job either succeeded or was skipped because nothing it covers
  # changed. Fail safe: push and workflow_dispatch run everything; on a pull request a failed diff fails
  # this job (and so the required checks), an empty diff runs everything, and any path that is not
  # documentation (*.md, LICENSE.txt, .claude/) counts as code.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      script: ${{ steps.classify.outputs.script }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          exit 1
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event $EVENT_NAME: running every job"
            flags="$(printf 'code=true\nscript=true\n')"
          else
            changed="$RUNNER_TEMP/changed-files.txt"
            git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$changed"
            echo "Changed files ($BASE_SHA...$HEAD_SHA):"
            # File names are PR content; stop workflow commands while they are printed
            stop_token="$(openssl rand -hex 16)"
            echo "::stop-commands::$stop_token"
            cat "$changed"
            echo "::$stop_token::"
            flags="$(bash .github/scripts/classify-changes.sh < "$changed")"
          fi
          echo "$flags"
          echo "$flags" >> "$GITHUB_OUTPUT"

  windows-app:
    name: Windows build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Visual Studio MSBuild cannot build the .NET 10 projects; the SDK builds the forms' resx itself
      - name: Build
        run: dotnet build ChanThreadWatch.sln -c Release -p:RestoreLockedMode=true -v:minimal -nologo

      - name: Test
        run: dotnet test ChanThreadWatch.sln -c Release --no-build --filter "TestCategory!=UI" --logger trx --results-directory TestResults

      # Launches the built app and drives its window; the hosted Windows runner has an interactive desktop
      - name: UI test
        run: dotnet test ChanThreadWatch.UITests/ChanThreadWatch.UITests.csproj -c Release --no-build --filter "TestCategory=UI" --logger trx --results-directory TestResults

      # Saved logins (DPAPI) written by the .NET Framework 4.8 app decrypt in the .NET 10 app and the reverse,
      # for settings.txt and threads.txt, under this job's one user
      - name: Saved logins across .NET Framework 4.8 and .NET 10
        shell: pwsh
        run: ./.github/scripts/test-stored-auth-cross-runtime.ps1

      # The release exes: self-contained single files for x64 and arm64
      - name: Publish
        shell: pwsh
        run: ./.github/scripts/publish-app.ps1

      # Starts the published x64 exe from a temp folder, with settings.txt next to it and then without it (the
      # runner's own AppData; this runner is a throwaway VM). Each run must reach the main window, save its
      # settings in the expected folder and exit with code 0. The arm64 exe cannot run on this x64 runner.
      - name: Start the published exe
        shell: pwsh
        run: |
          ./.github/scripts/test-published-app.ps1 -ExePath publish/ChanThreadWatch-win-x64.exe -Mode Portable
          ./.github/scripts/test-published-app.ps1 -ExePath publish/ChanThreadWatch-win-x64.exe -Mode AppData

      # A failed UI test saves a PNG of the app window (or the whole desktop) under TestResults
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults

  # The required "Build and test" check (see the note above "changes")
  build-and-test:
    name: Build and test
    needs: [changes, windows-app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Windows job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.windows-app.result }}
        run: |
          echo "changes: $CHANGES_RESULT (code=$CODE_CHANGED), Windows build and test: $RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            exit 1
          fi
          if [ "$RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$RESULT" = "skipped" ] && [ "$CODE_CHANGED" = "false" ]; then
            exit 0
          fi
          exit 1

  # ChanThreadWatch.Core on each OS. Linux and macOS skip the tests marked PendingUnix (each names
  # the MP-4 row that fixes it); Windows runs them all. Only "Core tests" below is a required check.
  # Saved logins: macOS gets a throwaway keychain and Linux a throwaway Secret Service (gnome-keyring in
  # its own D-Bus session), and CTW_KEYRING_TESTS=1 lets the tests use them under a unique test service
  # name. The tests honor it only in CI (GITHUB_ACTIONS), so a local run never touches a login store.
  core-tests:
    name: Core tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            filter: TestCategory!=UI
            keyring-tests: ''
          - os: ubuntu-latest
            filter: TestCategory!=PendingUnix&TestCategory!=UI
            keyring-tests: '1'
          - os: macos-latest
            filter: TestCategory!=PendingUnix&TestCategory!=UI
            keyring-tests: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Unlocked, without an auto-lock timeout, first in the search list and the default, so SecItemAdd
      # writes there and never to the runner's login keychain. Its password exists only in this step.
      - name: Create a test keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" ctw-test.keychain
          security set-keychain-settings ctw-test.keychain
          security unlock-keychain -p "$password" ctw-test.keychain
          security list-keychains -d user -s ctw-test.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s ctw-test.keychain

      - name: Install the Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-1-0 dbus

      - name: Test
        if: runner.os != 'Linux'
        env:
          TEST_FILTER: ${{ matrix.filter }}
          CTW_KEYRING_TESTS: ${{ matrix.keyring-tests }}
        run: dotnet test ChanThreadWatch.Core.Tests -c Release -p:RestoreLockedMode=true --filter "$TEST_FILTER"
        shell: bash

      # The tests run in a private D-Bus session (dbus-run-session, from the dbus package) whose
      # gnome-keyring is unlocked with a random password. Its keyring files go under RUNNER_TEMP
      # (XDG_DATA_HOME), not the runner's home; the daemon stops when the session ends. HOME is left
      # as it is, so dotnet keeps its NuGet cache.
      - name: Test
        if: runner.os == 'Linux'
        env:
          TEST_FILTER: ${{ matrix.filter }}
          CTW_KEYRING_TESTS: ${{ matrix.keyring-tests }}
        run: |
          KEYRING_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$KEYRING_PASSWORD"
          export KEYRING_PASSWORD
          export XDG_DATA_HOME="$RUNNER_TEMP/ctw-xdg-data"
          mkdir -p "$XDG_DATA_HOME"
          dbus-run-session -- bash -c 'printf "%s" "$KEYRING_PASSWORD" | gnome-keyring-daemon --unlock --components=secrets > /dev/null && dotnet test ChanThreadWatch.Core.Tests -c Release -p:RestoreLockedMode=true --filter "$TEST_FILTER"'
        shell: bash

      # The fallback when no Secret Service can be reached: logins are for the session only and nothing
      # throws. The test fails rather than skips when the variable is missing, and no test found is an error.
      - name: Saved logins without a Secret Service
        if: runner.os == 'Linux'
        env:
          CTW_KEYRING_TESTS: unavailable
          DBUS_SESSION_BUS_ADDRESS: unix:path=/nonexistent/ctw-no-session-bus
        run: dotnet test ChanThreadWatch.Core.Tests -c Release --no-build --filter "TestCategory=KeyringFallback" -- RunConfiguration.TreatNoTestsAsError=true
        shell: bash

      - name: Delete the test keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security default-keychain -d user -s login.keychain || true
          security delete-keychain ctw-test.keychain || true

  # One stable check name for all the legs: passes only if every leg succeeded, or the matrix was
  # skipped because "changes" found no code change. A failed or cancelled leg, or a failed "changes",
  # fails this required check.
  core-tests-result:
    name: Core tests
    needs: [changes, core-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the legs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.core-tests.result }}
        run: |
          echo "changes: $CHANGES_RESULT (code=$CODE_CHANGED), Core tests legs: $RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            exit 1
          fi
          if [ "$RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$RESULT" = "skipped" ] && [ "$CODE_CHANGED" = "false" ]; then
            exit 0
          fi
          exit 1

  offline-page-script:
    name: Offline page script
    needs: changes
    if: needs.changes.outputs.script == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/offline-page-script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the runner's preinstalled Node; jsdom is pinned by the lockfile and its install scripts are not run
      - name: Install jsdom
        run: npm ci --ignore-scripts

      # Runs src/ChanThreadWatch.Core/Resources/OfflinePageScript.js in jsdom against each site fixture
      - name: Test
        run: npm test

  complexity:
    name: Cyclomatic complexity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lizard
        run: pip install lizard==1.24.0

      # Maintainer decision: every app function stays at CCN <= 5 (Designer files and tests excluded)
      - name: Check CCN <= 5
        run: lizard -l csharp -x "*Designer.cs" -x "./ChanThreadWatch.Tests/*" -x "./ChanThreadWatch.UITests/*" -x "./ChanThreadWatch.*.Tests/*" -C 5 -w .
