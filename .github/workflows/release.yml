name: Release

on:
  push:
    tags: ['v*']
  # Manual dry run: build, test and hash the release files without publishing.
  # gh workflow run release.yml -f dry_run=true --ref <branch>
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and hash only. A manual run never publishes; false fails the run.
        type: boolean
        default: true

permissions:
  contents: read

# The files the release uploads, besides SHA256SUMS.txt, are in RELEASE_FILES, which the "List the release files"
# step of each job sets once they are published: the two app exes and the six command line files (their names hold
# the version). prepare-release.ps1 fails unless all eight are there.

jobs:
  # The command line (ctw) for Linux and macOS, published on each system: macOS runs an arm64 file only when it is
  # code-signed, and the SDK signs only on macOS (publish-cli.ps1 signs ad hoc). Read-only token; the files go to the
  # release job below as a workflow artifact, which it downloads with gh (no download Action).
  ctw-unix:
    name: Publish ctw (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rids: linux-x64,linux-arm64
            artifact: ctw-linux
          - os: macos-latest
            rids: osx-x64,osx-arm64
            artifact: ctw-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # One shared version (G13): fails when ctw's version differs from the app's AssemblyVersion. The file for the
      # runner's own system is run with --version.
      - name: Publish the command line and check its version
        shell: pwsh
        env:
          CTW_RIDS: ${{ matrix.rids }}
        run: ./.github/scripts/publish-cli.ps1 -RuntimeIdentifiers $env:CTW_RIDS

      # Only the release files (publish/ctw-<version>-<rid>), not the publish folders under publish/build-ctw
      - name: Keep the files for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: publish/ctw-*
          if-no-files-found: error
          retention-days: 5

  # Tag pushes only. This is the one job with write access, and the only place that creates a release.
  release:
    name: Build and publish release
    needs: ctw-unix
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # gh run download of the ctw-unix files of this run
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The in-app update check compares Major.Minor.Revision of AssemblyVersion with the release tag
      - name: Verify tag matches AssemblyVersion
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $match = Select-String -Path src/ChanThreadWatch/Properties/AssemblyInfo.cs -Pattern '^\[assembly: AssemblyVersion\("(\d+)\.(\d+)\.(\d+)\.(\d+)"\)\]'
          if (-not $match) { throw 'AssemblyVersion not found in src/ChanThreadWatch/Properties/AssemblyInfo.cs' }
          $g = $match.Matches[0].Groups
          $expected = "v$($g[1].Value).$($g[2].Value).$($g[4].Value)"
          if ($env:TAG -ne $expected) { throw "Tag $env:TAG does not match AssemblyVersion (expected $expected)" }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ChanThreadWatch.sln -c Release -p:RestoreLockedMode=true -v:minimal -nologo

      - name: Test
        run: dotnet test ChanThreadWatch.sln -c Release --no-build

      - name: Publish
        shell: pwsh
        run: ./.github/scripts/publish-app.ps1

      # One shared version (G13): fails when ctw's version differs from the app's AssemblyVersion
      - name: Publish the command line for Windows and check its version
        shell: pwsh
        run: ./.github/scripts/publish-cli.ps1 -RuntimeIdentifiers win-x64,win-arm64

      - name: Download the command line for Linux and macOS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($name in 'ctw-linux', 'ctw-macos') {
            gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $name --dir publish
            if ($LASTEXITCODE -ne 0) { throw "gh run download of $name failed with exit code $LASTEXITCODE" }
          }

      # One self-contained single-file exe per Windows architecture (publish-app.ps1) and one self-contained single
      # file of the command line per system (publish-cli.ps1); prepare-release.ps1 checks that all eight are there
      - name: List the release files
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath publish -File | Where-Object { $_.Name -like 'ChanThreadWatch-*.exe' -or $_.Name -like 'ctw-*' } | Sort-Object Name | ForEach-Object { "publish/$($_.Name)" })
          "RELEASE_FILES=$($files -join ' ')" | Add-Content -LiteralPath $env:GITHUB_ENV

      # Strict: a release is only published after a clean scan with updated signatures
      - name: Defender scan
        shell: pwsh
        run: ./.github/scripts/defender-scan.ps1 -Strict

      - name: Prepare release notes and checksums
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          DRY_RUN: 'false'
        run: ./.github/scripts/prepare-release.ps1

      - name: Publish release
        # Repeats the job condition so the publish step cannot run on any other event
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = $env:RELEASE_FILES -split ' ' | Where-Object { $_ }
          gh release create $env:TAG @files SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --notes-file RELEASE_NOTES.md --title $env:TAG --latest

  # Manual runs only. Read-only token and no publish step: build code and test dependencies run in this job,
  # and any process in a job can read that job's token, so a dry run never holds a token that can write.
  dry-run:
    name: Release dry run (no publish)
    needs: ctw-unix
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # gh run download of the ctw-unix files of this run
      actions: read
    steps:
      - name: Refuse to publish from a manual run
        shell: pwsh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ($env:DRY_RUN -ne 'true') {
            throw 'A manual run cannot publish a release. Push a v* tag to release, or run again with dry_run=true.'
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ChanThreadWatch.sln -c Release -p:RestoreLockedMode=true -v:minimal -nologo

      - name: Test
        run: dotnet test ChanThreadWatch.sln -c Release --no-build

      - name: Publish
        shell: pwsh
        run: ./.github/scripts/publish-app.ps1

      - name: Publish the command line for Windows and check its version
        shell: pwsh
        run: ./.github/scripts/publish-cli.ps1 -RuntimeIdentifiers win-x64,win-arm64

      - name: Download the command line for Linux and macOS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($name in 'ctw-linux', 'ctw-macos') {
            gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $name --dir publish
            if ($LASTEXITCODE -ne 0) { throw "gh run download of $name failed with exit code $LASTEXITCODE" }
          }

      - name: List the release files
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath publish -File | Where-Object { $_.Name -like 'ChanThreadWatch-*.exe' -or $_.Name -like 'ctw-*' } | Sort-Object Name | ForEach-Object { "publish/$($_.Name)" })
          "RELEASE_FILES=$($files -join ' ')" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Defender scan
        shell: pwsh
        run: ./.github/scripts/defender-scan.ps1

      # No TAG: the script derives the tag from AssemblyVersion and prints it
      - name: Prepare release notes and checksums
        shell: pwsh
        env:
          DRY_RUN: 'true'
        run: ./.github/scripts/prepare-release.ps1
