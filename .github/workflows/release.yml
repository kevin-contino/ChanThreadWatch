name: Release

on:
  push:
    tags: ['v*']
  # Manual dry run: build, test and hash the release files without publishing.
  # gh workflow run release.yml -f dry_run=true --ref <branch>
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and hash only. A manual run never publishes; false fails the run.
        type: boolean
        default: true

permissions:
  contents: read

# The files the release uploads, besides SHA256SUMS.txt, are in RELEASE_FILES, which the "List the release files"
# step of each job sets once they are published (the command line zip's name holds the version).

jobs:
  # Tag pushes only. This is the one job with write access, and the only place that creates a release.
  release:
    name: Build and publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The in-app update check compares Major.Minor.Revision of AssemblyVersion with the release tag
      - name: Verify tag matches AssemblyVersion
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $match = Select-String -Path src/ChanThreadWatch/Properties/AssemblyInfo.cs -Pattern 'AssemblyVersion\("(\d+)\.(\d+)\.(\d+)\.(\d+)"\)'
          if (-not $match) { throw 'AssemblyVersion not found in src/ChanThreadWatch/Properties/AssemblyInfo.cs' }
          $g = $match.Matches[0].Groups
          $expected = "v$($g[1].Value).$($g[2].Value).$($g[4].Value)"
          if ($env:TAG -ne $expected) { throw "Tag $env:TAG does not match AssemblyVersion (expected $expected)" }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ChanThreadWatch.sln -c Release -p:RestoreLockedMode=true -v:minimal -nologo

      - name: Test
        run: dotnet test ChanThreadWatch.sln -c Release --no-build

      - name: Publish
        shell: pwsh
        run: ./.github/scripts/publish-app.ps1

      # One shared version (G13): fails when ctw's version differs from the app's AssemblyVersion
      - name: Publish the command line and check its version
        shell: pwsh
        run: ./.github/scripts/publish-cli.ps1

      # One self-contained single-file exe per Windows architecture (publish-app.ps1) and the command line zip for
      # every OS (publish-cli.ps1)
      - name: List the release files
        shell: pwsh
        run: |
          $cliZip = @(Get-ChildItem -LiteralPath publish -Filter 'ctw-*.zip' -File)
          if ($cliZip.Count -ne 1) { throw "Expected one publish/ctw-*.zip, found $($cliZip.Count)" }
          "RELEASE_FILES=publish/ChanThreadWatch-win-x64.exe publish/ChanThreadWatch-win-arm64.exe publish/$($cliZip[0].Name)" | Add-Content -LiteralPath $env:GITHUB_ENV

      # Strict: a release is only published after a clean scan with updated signatures
      - name: Defender scan
        shell: pwsh
        run: ./.github/scripts/defender-scan.ps1 -Strict

      - name: Prepare release notes and checksums
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          DRY_RUN: 'false'
        run: ./.github/scripts/prepare-release.ps1

      - name: Publish release
        # Repeats the job condition so the publish step cannot run on any other event
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = $env:RELEASE_FILES -split ' ' | Where-Object { $_ }
          gh release create $env:TAG @files SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --notes-file RELEASE_NOTES.md --title $env:TAG --latest

  # Manual runs only. Read-only token and no publish step: build code and test dependencies run in this job,
  # and any process in a job can read that job's token, so a dry run never holds a token that can write.
  dry-run:
    name: Release dry run (no publish)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Refuse to publish from a manual run
        shell: pwsh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ($env:DRY_RUN -ne 'true') {
            throw 'A manual run cannot publish a release. Push a v* tag to release, or run again with dry_run=true.'
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ChanThreadWatch.sln -c Release -p:RestoreLockedMode=true -v:minimal -nologo

      - name: Test
        run: dotnet test ChanThreadWatch.sln -c Release --no-build

      - name: Publish
        shell: pwsh
        run: ./.github/scripts/publish-app.ps1

      - name: Publish the command line and check its version
        shell: pwsh
        run: ./.github/scripts/publish-cli.ps1

      - name: List the release files
        shell: pwsh
        run: |
          $cliZip = @(Get-ChildItem -LiteralPath publish -Filter 'ctw-*.zip' -File)
          if ($cliZip.Count -ne 1) { throw "Expected one publish/ctw-*.zip, found $($cliZip.Count)" }
          "RELEASE_FILES=publish/ChanThreadWatch-win-x64.exe publish/ChanThreadWatch-win-arm64.exe publish/$($cliZip[0].Name)" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Defender scan
        shell: pwsh
        run: ./.github/scripts/defender-scan.ps1

      # No TAG: the script derives the tag from AssemblyVersion and prints it
      - name: Prepare release notes and checksums
        shell: pwsh
        env:
          DRY_RUN: 'true'
        run: ./.github/scripts/prepare-release.ps1
