name: Live canary

# Once a week, checks that each site helper still parses its imageboard's current markup.
# Fetches one live thread per site and verifies it with the fixture sanitizer (nothing is written).
# The logs are public: the canary prints only site names, pass or fail, counts and generic reasons.
on:
  schedule:
    - cron: "37 6 * * 1" # Mondays 06:37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  canary:
    name: Live site canary
    # Scheduled runs only in the main repository, not in forks
    if: github.event_name != 'schedule' || github.repository == 'kevin-contino/ChanThreadWatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ChanThreadWatch.sln -c Release -v:minimal -nologo

      # The runner image's Python is enough: the canary and the sanitizer use only the standard library
      - name: Run canary
        run: python tools/site-fixtures/live_canary.py
